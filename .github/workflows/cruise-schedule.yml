name: Update cruise schedule
on:
  schedule:
    - cron: '0 7 * * 1'  # har dushanba 07:00 UTC — haftalik yangilash
  workflow_dispatch:  # qo'lda ishga tushirish ham mumkin
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update cruise schedule
        run: python3 radar/update-cruise-schedule.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/cruise-schedule.json
          git diff --cached --quiet || git commit -m "Cruise schedule auto-update"
          git push
