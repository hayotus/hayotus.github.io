<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NYC Airport Radar 🚕</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #000; }
  .leaflet-container { background: #000; }

  /* Yuklanish ekrani */
  #loader {
    position: absolute; inset: 0; background: #121212; z-index: 2000;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid #2C2C2E; border-top-color: #0A84FF;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { color: #8E8E93; font-size: 14px; text-align: center; padding: 0 24px; }

  /* Yuqori panel */
  #topbar {
    position: absolute; top: 10px; left: 0; right: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  #header {
    width: 92%; max-width: 560px; background: rgba(18,18,18,0.94);
    border: 1px solid #2C2C2E; border-radius: 22px;
    padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    pointer-events: auto;
  }
  #title { font-size: 14px; font-weight: 900; color: #fff; letter-spacing: 0.3px; }
  #traffic { font-size: 11px; font-weight: bold; color: #30D158; margin-top: 2px; }
  #speedBadge {
    background: #2C2C2E; border-radius: 14px; padding: 6px 12px;
    text-align: center; min-width: 74px;
  }
  #speedBadge .num { color: #30D158; font-size: 16px; font-weight: bold; }
  #speedBadge .unit { color: #30D158; font-size: 10px; }
  #speedBadge .warn { display: none; color: #fff; font-size: 9px; font-weight: 900; margin-top: 1px; }
  #speedBadge.over { background: #FF3B30; }
  #speedBadge.over .num, #speedBadge.over .unit { color: #fff; }
  #speedBadge.over .warn { display: block; }
  #recenter, #trafficToggle, #locationMenuToggle {
    pointer-events: auto; background: rgba(18,18,18,0.88); color: #0A84FF;
    border: 1px solid #0A84FF; border-radius: 16px; padding: 6px 14px;
    font-size: 11px; font-weight: bold; cursor: pointer;
  }
  #recenter:active, #trafficToggle:active, #locationMenuToggle:active { background: rgba(10,132,255,0.25); }
  #btnRow {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    pointer-events: none;
  }
  #trafficToggle.off { color: #8E8E93; border-color: #3A3A3C; }

  /* Pastki doiralar */
  #bottombar {
    position: absolute; bottom: 18px; left: 0; right: 0; z-index: 1000;
    display: flex; justify-content: space-around; padding: 0 10px; pointer-events: none;
  }
  .circleCard {
    pointer-events: auto; width: 110px; height: 110px; border-radius: 55px;
    background: rgba(18,18,18,0.95); border: 3px solid #888;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,0.6); user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .circleCard:active { transform: scale(0.96); }
  .circleCard .code { font-size: 15px; font-weight: 900; }
  .circleCard .time { color: #fff; font-size: 19px; font-weight: bold; margin: 1px 0; }
  .circleCard .dist { color: #0A84FF; font-size: 13px; font-weight: 600; }
  .circleCard .dist .u { color: #8E8E93; font-size: 11px; font-weight: normal; }

  /* Aeroport markeri */
  .airport-marker {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid #fff; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    cursor: pointer;
  }
  /* Foydalanuvchi nuqtasi */
  .user-dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: #0A84FF; border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(10,132,255,0.3), 0 2px 8px rgba(0,0,0,0.6);
  }

  /* Lokatsiya menyusi (tugmalar qatorida) */
  #locationMenuWrap { position: relative; pointer-events: auto; }
  #locationMenu {
    display: none; position: absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); width: 220px; padding: 8px; z-index: 1300;
    background: rgba(18,18,18,0.97); border: 1px solid #3A3A3C;
    border-radius: 16px; box-shadow: 0 8px 22px rgba(0,0,0,0.55);
  }
  #locationMenu.open { display: block; }
  .location-option {
    display: block; width: 100%; margin: 4px 0; padding: 10px;
    text-align: left; color: #fff; background: #242426;
    border: 1px solid #3A3A3C; border-radius: 10px;
    font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .location-option:active { background: #0A84FF; }
  .location-option span {
    display: block; margin-top: 4px; color: #B8B8BD;
    font-size: 10px; font-weight: 500; line-height: 1.35;
  }

</style>
</head>
<body>


<div id="map"></div>

<div id="loader">
  <div class="spinner"></div>
  <p>Rideshare GPS &amp; Aeroportlar radar yuklanmoqda...</p>
</div>

<div id="topbar">
  <div id="header">
    <div>
      <div id="title">NYC AIRPORT RADAR 🚕</div>
      <div id="traffic">STEADY FLOW 🚗</div>
    </div>
    <div id="speedBadge">
      <span class="num" id="speedNum">0</span> <span class="unit">mph</span>
      <div class="warn">LIMIT 65!</div>
    </div>
  </div>
  <div id="btnRow">
    <button id="recenter">🌐 RE-CENTER ALL AIRPORTS</button>
    <button id="trafficToggle">🚦 TRAFFIC: ON</button>
    <div id="locationMenuWrap">
      <button id="locationMenuToggle" aria-expanded="false" aria-controls="locationMenu">☰ LOCATIONS</button>
      <div id="locationMenu">
        <button class="location-option" data-location="1">Office 40w St<span>360 W 40th St, New York, NY 10018</span></button>
        <button class="location-option" data-location="2">Office 10e St<span>277 E 10th St, New York, NY 10009</span></button>
        <button class="location-option" data-location="3">Virgin Hotel<span>1227 Broadway, New York, NY 10001</span></button>
        <button class="location-option" data-location="4">Location 4<span>Times Square, Manhattan, NY</span></button>
      </div>
    </div>
  </div>
</div>

<div id="bottombar"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const AIRPORTS = [
    { id: '1', name: 'JFK Airport',     code: 'JFK', lat: 40.6413, lon: -73.7781, color: '#FF9500' },
    { id: '2', name: 'LaGuardia',       code: 'LGA', lat: 40.7769, lon: -73.8740, color: '#30D158' },
    { id: '3', name: 'Newark Liberty',  code: 'EWR', lat: 40.6895, lon: -74.1745, color: '#BF5AF2' },
  ];


  // Saqlangan lokatsiyalar (Location 4 hozircha Times Square).
  const SAVED_LOCATIONS = [
    { id: 1, name: 'Office 40w St', address: '360 W 40th St, New York, NY 10018', lat: 40.75696, lon: -73.99338 },
    { id: 2, name: 'Office 10e St', address: '277 E 10th St, New York, NY 10009', lat: 40.72818, lon: -73.98279 },
    { id: 3, name: 'Virgin Hotel', address: '1227 Broadway, New York, NY 10001', lat: 40.74674, lon: -73.98865 },
    { id: 4, name: 'Location 4', address: 'Times Square, Manhattan, NY', lat: 40.7580, lon: -73.9855 },
  ];

  function openLocationNavigation(location) {
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    let url;
    if (isIOS) {
      url = `maps://?daddr=${location.lat},${location.lon}&dirflg=d`;
    } else if (isAndroid) {
      url = `geo:${location.lat},${location.lon}?q=${location.lat},${location.lon}(${encodeURIComponent(location.address)})`;
    } else {
      url = `https://www.google.com/maps/dir/?api=1&destination=${location.lat},${location.lon}`;
    }
    window.location.href = url;
  }

  function initLocationMenu() {
    const toggle = document.getElementById('locationMenuToggle');
    const menu = document.getElementById('locationMenu');
    toggle.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });
    document.querySelectorAll('.location-option').forEach(button => {
      button.addEventListener('click', () => {
        const location = SAVED_LOCATIONS.find(item => item.id === Number(button.dataset.location));
        if (location) openLocationNavigation(location);
      });
    });
  }

  const TOMTOM_KEY = '6OihyLXDxuOwymbhmSqC20o8MjjwoCTJ';

  let map, userMarker, autoZoom = true;
  let trafficLayer = null, trafficOn = true;
  let userLat = null, userLon = null;
  let lastRouteFetch = 0, lastFetchLat = null, lastFetchLon = null;
  const routeLines = {};
  const airportInfo = {};

  // --- Tirbandlik / talab holati (soatga qarab) ---
  function evaluateTrafficDemand() {
    const hour = new Date().getHours();
    let text;
    if ((hour >= 16 && hour <= 20) || (hour >= 6 && hour <= 9)) text = 'HIGH DEMAND 🔥';
    else if (hour >= 21 || hour <= 5) text = 'NIGHT FLIGHTS 🌙';
    else text = 'STEADY FLOW 🚗';
    document.getElementById('traffic').textContent = text;
  }

  // --- Navigatsiyani ochish (marker yoki doira bosilganda) ---
  function openNavigation(airport) {
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    let url;
    if (isIOS) {
      url = `maps://?daddr=${airport.lat},${airport.lon}&dirflg=d`;
    } else if (isAndroid) {
      url = `geo:${airport.lat},${airport.lon}?q=${airport.lat},${airport.lon}(${encodeURIComponent(airport.name)})`;
    } else {
      url = `https://www.google.com/maps/dir/?api=1&destination=${airport.lat},${airport.lon}`;
    }
    window.location.href = url;
  }

  // --- TomTom orqali marshrut (TRAFFIC tugmasiga qarab: on = tirbandlik bilan, off = trafficsiz) ---
  async function fetchRoute(uLat, uLon, airport) {
    try {
      const url = `https://api.tomtom.com/routing/1/calculateRoute/${uLat},${uLon}:${airport.lat},${airport.lon}/json?key=${TOMTOM_KEY}&traffic=${trafficOn}&routeRepresentation=polyline&travelMode=car`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const points = route.legs[0].points.map(p => [p.latitude, p.longitude]);
        const distanceMiles = (route.summary.lengthInMeters * 0.000621371).toFixed(1);
        // traffic=false da TomTom baribir tirbandlik kechikishini qo'shib yuborishi mumkin —
        // shuning uchun OFF rejimda kechikishni ayirib, sof (trafficsiz) vaqtni olamiz
        let travelSecs = route.summary.travelTimeInSeconds;
        if (!trafficOn && route.summary.trafficDelayInSeconds) {
          travelSecs = Math.max(0, travelSecs - route.summary.trafficDelayInSeconds);
        }
        const durationMins = Math.round(travelSecs / 60);
        let durationText = `${durationMins} min`;
        if (durationMins >= 60) {
          const h = Math.floor(durationMins / 60);
          const m = durationMins % 60;
          durationText = `${h}s ${m}m`;
        }
        return { points, distanceMiles, durationText };
      }
    } catch (e) { console.log('TomTom route error:', e); }
    return fetchRouteOSRM(uLat, uLon, airport);
  }

  // --- OSRM orqali marshrut (zaxira) ---
  async function fetchRouteOSRM(uLat, uLon, airport) {
    try {
      const url = `https://router.project-osrm.org/route/v1/driving/${uLon},${uLat};${airport.lon},${airport.lat}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const points = route.geometry.coordinates.map(c => [c[1], c[0]]);
        const distanceMiles = (route.distance * 0.000621371).toFixed(1);
        const durationMins = Math.round(route.duration / 60);
        let durationText = `${durationMins} min`;
        if (durationMins >= 60) {
          const h = Math.floor(durationMins / 60);
          const m = durationMins % 60;
          durationText = `${h}s ${m}m`;
        }
        return { points, distanceMiles, durationText };
      }
    } catch (e) { console.log('Route error:', e); }
    return null;
  }

  async function refreshRoutes() {
    if (userLat === null) return;
    lastRouteFetch = Date.now();
    lastFetchLat = userLat; lastFetchLon = userLon;
    for (const airport of AIRPORTS) {
      const res = await fetchRoute(userLat, userLon, airport);
      if (res) {
        airportInfo[airport.id] = { dist: res.distanceMiles, time: res.durationText };
        if (routeLines[airport.id]) {
          routeLines[airport.id].setLatLngs(res.points);
        } else {
          routeLines[airport.id] = L.polyline(res.points, { color: airport.color, weight: 4.5 }).addTo(map);
        }
        updateCard(airport);
      }
    }
  }

  function fitAll() {
    if (!map || userLat === null || !autoZoom) return;
    const pts = [[userLat, userLon], ...AIRPORTS.map(a => [a.lat, a.lon])];
    map.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [45, 130], paddingBottomRight: [45, 170] });
  }

  function updateCard(airport) {
    const info = airportInfo[airport.id] || { dist: '--', time: '--' };
    const el = document.getElementById('time-' + airport.id);
    const dl = document.getElementById('dist-' + airport.id);
    if (el) el.textContent = info.time;
    if (dl) dl.innerHTML = `${info.dist} <span class="u">mi</span>`;
  }

  function buildCards() {
    const bar = document.getElementById('bottombar');
    AIRPORTS.forEach(a => {
      const card = document.createElement('div');
      card.className = 'circleCard';
      card.style.borderColor = a.color;
      card.innerHTML = `
        <div class="code" style="color:${a.color}">${a.code}</div>
        <div class="time" id="time-${a.id}">--</div>
        <div class="dist" id="dist-${a.id}">-- <span class="u">mi</span></div>`;
      card.addEventListener('click', () => openNavigation(a));
      bar.appendChild(card);
    });
  }

  function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: true });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16,
    }).addTo(map);
    map.setView([40.7308, -73.9973], 11);

    AIRPORTS.forEach(a => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="airport-marker" style="background:${a.color}">${a.code}</div>`,
        iconSize: [34, 34], iconAnchor: [17, 17],
      });
      const marker = L.marker([a.lat, a.lon], { icon }).addTo(map);
      marker.bindTooltip(`<b>${a.code} Terminal</b><br>Rideshare Pickup Zone`, { direction: 'top', offset: [0, -18] });
      marker.on('click', () => openNavigation(a));
      L.circle([a.lat, a.lon], {
        radius: 4828, color: a.color, weight: 1.5,
        fillColor: a.color, fillOpacity: 0.1,
      }).addTo(map);
    });

    document.getElementById('recenter').addEventListener('click', () => {
      autoZoom = true;
      fitAll();
    });

    // --- TomTom jonli tirbandlik qatlami (relative flow) ---
    trafficLayer = L.tileLayer(
      'https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=' + TOMTOM_KEY,
      { maxZoom: 22, opacity: 0.95, attribution: '&copy; TomTom' }
    ).addTo(map);

    const tBtn = document.getElementById('trafficToggle');
    tBtn.addEventListener('click', () => {
      trafficOn = !trafficOn;
      if (trafficOn) { trafficLayer.addTo(map); } else { map.removeLayer(trafficLayer); }
      tBtn.textContent = trafficOn ? '🚦 TRAFFIC: ON' : '🚦 TRAFFIC: OFF';
      tBtn.classList.toggle('off', !trafficOn);
      refreshRoutes();
    });
  }

  function onPosition(pos) {
    const { latitude, longitude, speed } = pos.coords;
    userLat = latitude; userLon = longitude;

    document.getElementById('loader').style.display = 'none';

    // Tezlik (m/s -> mph)
    const mph = speed && speed > 0 ? speed * 2.23694 : 0;
    document.getElementById('speedNum').textContent = mph.toFixed(0);
    document.getElementById('speedBadge').classList.toggle('over', mph > 65);

    if (!userMarker) {
      const icon = L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
      userMarker = L.marker([latitude, longitude], { icon, zIndexOffset: 1000 }).addTo(map);
      fitAll();
    } else {
      userMarker.setLatLng([latitude, longitude]);
    }

    // Marshrutlar: har 30 soniyada yoki 100 m dan ko'p harakatlanganda yangilanadi
    const now = Date.now();
    let moved = Infinity;
    if (lastFetchLat !== null) {
      const dLat = (latitude - lastFetchLat) * 111320;
      const dLon = (longitude - lastFetchLon) * 85000;
      moved = Math.sqrt(dLat * dLat + dLon * dLon);
    }
    if (now - lastRouteFetch > 30000 || moved > 100) {
      refreshRoutes();
    }
  }

  function onPositionError(err) {
    const p = document.querySelector('#loader p');
    if (p) p.textContent = 'GPS ruxsati berilmadi. Brauzer sozlamalaridan joylashuvga ruxsat bering va sahifani yangilang.';
    console.log('Location error:', err);
  }

  // --- Ishga tushirish ---
  evaluateTrafficDemand();
  setInterval(evaluateTrafficDemand, 60000);
  buildCards();
  initMap();
  initLocationMenu();

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true, maximumAge: 3000, timeout: 20000,
    });
  } else {
    onPositionError(new Error('Geolocation not supported'));
  }
</script>
</body>
</html>
